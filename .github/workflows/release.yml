name: Revolution desktop release
on:
  workflow_dispatch:
  push:
    branches: ['codex/release-preview/**']
    tags: ['revolution-v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/revolution/package-lock.json
      - name: Build downstream plugins
        run: npm run build && npm run build:brand && npm run build:knowledge && npm run test:workflow && npm run test:knowledge && npm run test:knowledge-app && npm run test:bot
      - name: Validate release tag and locked version
        run: node scripts/check-release.mjs
      - name: Install locked runtime
        run: npm --prefix apps/revolution ci --install-links
      - name: Prepare icon
        run: node scripts/prepare-desktop.mjs
      - name: Package internal preview (macOS ad-hoc, not notarized)
        timeout-minutes: 12
        run: npm --prefix apps/revolution run package
      - name: Verify macOS application signatures
        if: runner.os == 'macOS'
        run: node scripts/verify-mac.mjs
      - name: Verify macOS desktop launch and page load
        if: runner.os == 'macOS'
        run: node scripts/smoke-desktop-mac.mjs
      - name: Verify knowledge and bot settings in Electron
        if: runner.os == 'macOS'
        run: ./apps/revolution/node_modules/.bin/electron scripts/smoke-knowledge-electron.cjs
      - name: Verify packaged runtime on Linux
        if: runner.os == 'Linux'
        run: node scripts/smoke-runtime.mjs dist/linux-unpacked/resources/app/runtime.mjs
      - name: Verify packaged runtime on macOS
        if: runner.os == 'macOS'
        run: node scripts/smoke-runtime.mjs dist/mac-arm64/Revolution.app/Contents/Resources/app/runtime.mjs
      - name: Verify packaged runtime on Windows
        if: runner.os == 'Windows'
        run: node scripts/smoke-runtime.mjs dist/win-unpacked/resources/app/runtime.mjs
      - name: Compute installer checksums
        run: node scripts/checksums.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: revolution-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 3
  publish:
    if: startsWith(github.ref, 'refs/tags/revolution-v')
    needs: desktop
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" release-assets/* --draft --prerelease
          --title "Revolution $RELEASE_TAG Preview"
          --notes "Internal testing preview. macOS is ad-hoc signed only: no Developer ID or Apple notarization; Gatekeeper may block downloaded copies. Windows is unsigned. Do not disable system-wide security protections. Configure your own API key in Settings → Models; provider usage may incur charges. See docs/BETA_TESTING.md in this tag for installation, privacy and feedback instructions."
