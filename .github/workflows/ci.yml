name: Revolution checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Select checks from changed files
        id: impact
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci-impact.mjs
      - name: Build and verify plugins
        if: steps.impact.outputs.plugins == 'true'
        run: |
          npm run build && npm run build:brand && npm run build:knowledge
          node --check plugins/workflow-studio/lib/client.js
          node --check plugins/revolution-brand/lib/client.js
          npm run test:workflow
          npm run test:knowledge-app
          node --check plugins/revolution-knowledge/lib/client.js
          git diff --exit-code -- plugins/workflow-studio/lib/client.js plugins/revolution-brand/lib/client.js plugins/revolution-knowledge/lib/client.js plugins/revolution-knowledge/engine
      - name: Check knowledge library
        if: steps.impact.outputs.knowledge == 'true'
        run: npm run build:knowledge && npm run kb -- check && npm run test:knowledge && npm run test:knowledge-app
      - name: Check bot routing
        if: steps.impact.outputs.bot == 'true'
        run: npm run test:bot
      - name: Check desktop and release configuration
        if: steps.impact.outputs.desktop == 'true'
        run: |
          node --check apps/revolution/main.cjs
          node --check apps/revolution/runtime.mjs
          node --check apps/revolution/after-pack.cjs
          node --check scripts/verify-mac.mjs
          node --check scripts/smoke-desktop-mac.mjs
          node --test scripts/ci-impact.test.mjs scripts/runtime-profile.test.mjs
          node scripts/check-release.mjs
